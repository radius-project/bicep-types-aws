# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish main AWS Bicep types

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: aws-bicep-main
  cancel-in-progress: false

env:
  INPUT_DIRECTORY: ${{ github.workspace }}/../aws-bicep-publication

jobs:
  capture:
    name: Capture main AWS Bicep types
    if: github.repository == 'radius-project/bicep-types-aws' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id || steps.upload.outputs.artifact-id }}
      generation_run_id: ${{ steps.select.outputs.generation_run_id }}
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000/tcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate source and select original snapshot
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: select

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.select.outputs.reuse == 'false'
        with:
          go-version-file: src/aws-type-downloader/go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.select.outputs.reuse == 'false'
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Build trusted generation tools without cloud credentials
        if: steps.select.outputs.reuse == 'false'
        run: |
          git submodule update --init --recursive
          npm --prefix bicep-types/src/bicep-types ci
          npm --prefix bicep-types/src/bicep-types run build
          npm --prefix src/aws-type-generator ci
          npm --prefix src/aws-type-generator run build
          (cd src/aws-type-downloader && go build -o "${RUNNER_TEMP}/aws-type-downloader" .)
          bash .github/scripts/install-bicep-tools.sh "${RUNNER_TEMP}/bicep-tools"
          echo "${RUNNER_TEMP}/bicep-tools" >> "${GITHUB_PATH}"
          mkdir -p "${INPUT_DIRECTORY}/schemas" "${INPUT_DIRECTORY}/generated"
          cp artifacts/types/*.json "${INPUT_DIRECTORY}/schemas/"

      - name: Refresh public AWS schemas with read-only credentials
        if: steps.select.outputs.reuse == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_CONFIG_FILE: /dev/null
        run: |
          test -n "${AWS_ACCESS_KEY_ID}" && test -n "${AWS_SECRET_ACCESS_KEY}" || {
            echo "::error::Configure the existing read-only AWS schema identity for this repository"; exit 1;
          }
          "${RUNNER_TEMP}/aws-type-downloader" --output "${INPUT_DIRECTORY}/schemas" --clean

      - name: Generate AWS types from the captured schemas
        if: steps.select.outputs.reuse == 'false'
        run: |
          node src/aws-type-generator/dist/src/main.js \
            --input "${INPUT_DIRECTORY}/schemas" --output "${INPUT_DIRECTORY}/generated" \
            --releaseVersion latest

      - name: Capture native OCI layout and schema inputs/output
        if: steps.select.outputs.reuse == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: capture
          INPUT_REGISTRY: localhost:${{ job.services.registry.ports['5000'] }}

      - name: Retain original raw snapshot
        if: steps.select.outputs.reuse == 'false'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.INPUT_DIRECTORY }}/bicep-types-aws-${{ github.run_id }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish AWS Bicep edge
    needs: [capture]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - name: Checkout trusted publisher, not generated code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned OCI copy tool
        run: |
          bash .github/scripts/install-bicep-tools.sh "${RUNNER_TEMP}/bicep-tools" oras
          echo "${RUNNER_TEMP}/bicep-tools" >> "${GITHUB_PATH}"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/bicep-write-credentials" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: ${{ env.INPUT_DIRECTORY }}/download
          github-token: ${{ github.token }}
          repository: radius-project/bicep-types-aws
          run-id: ${{ needs.capture.outputs.generation_run_id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Authenticate original capture and validate data-only artifact
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: prepare
          INPUT_ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}

      - name: Login with source-owned package authority
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish current main only
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: publish

      - name: Retain publication receipt
        id: receipt
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-bicep-edge-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.INPUT_DIRECTORY }}/receipt.json
          if-no-files-found: error
          retention-days: 90

  mirror:
    name: Request private AWS development mirror
    needs: [publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted mirror caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned manifest verification tool
        run: |
          bash .github/scripts/install-bicep-tools.sh "${RUNNER_TEMP}/bicep-tools" oras
          echo "${RUNNER_TEMP}/bicep-tools" >> "${GITHUB_PATH}"

      - name: Download this run's GHCR publication receipt
        id: receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.publish.outputs.receipt_artifact_id }}
          path: ${{ env.INPUT_DIRECTORY }}
          merge-multiple: true
          digest-mismatch: error

      - name: Get narrowly scoped private publisher App token
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RADIUS_PUBLISHER_BOT_APP_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          permission-metadata: read
          permission-actions: read
          permission-contents: write
          owner: azure-octo
          repositories: radius-publisher

      - name: Reconcile exact-digest private copy and verify anonymous ACR bytes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/mirror-main-bicep.mjs`);
            const publisherGithub = getOctokit(process.env.PUBLISHER_TOKEN, {request: {timeout: 20000}});
            await script({github, publisherGithub, core, context});
        env:
          PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}

      - name: Retain partial or verified mirror receipt
        if: always() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-bicep-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.INPUT_DIRECTORY }}/receipt.json
          if-no-files-found: error
          retention-days: 90
