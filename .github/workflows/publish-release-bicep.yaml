# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish versioned AWS Bicep types
run-name: Publish AWS ${{ github.event.client_payload.version }} at ${{ github.event.client_payload.sourceCommit }}

# repository_dispatch selects the default-branch workflow, not tag-owned YAML.
on:
  repository_dispatch:
    types: [aws-bicep-release]

permissions: {}
concurrency:
  group: aws-bicep-release-${{ github.event.client_payload.version }}
  cancel-in-progress: false

env:
  INPUT_DIRECTORY: ${{ github.workspace }}/../aws-bicep-publication

jobs:
  select:
    name: Authenticate AWS release request
    if: github.repository == 'radius-project/bicep-types-aws' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      generation_run_id: ${{ steps.select.outputs.generation_run_id }}
      reuse: ${{ steps.select.outputs.reuse }}
      type_version: ${{ steps.select.outputs.type_version }}
      source_commit: ${{ steps.select.outputs.source_commit }}
    steps:
      - name: Checkout default-main controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install trusted preflight tool
        run: |
          bash .github/scripts/install-bicep-tools.sh "${RUNNER_TEMP}/bicep-tools" oras
          echo "${RUNNER_TEMP}/bicep-tools" >> "${GITHUB_PATH}"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/bicep-read-credentials" >> "${GITHUB_ENV}"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate frozen source and select original evidence
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: select

  schemas:
    name: Capture AWS schema inputs
    needs: [select]
    if: needs.select.outputs.reuse == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Operators must separately restrict this environment to reviewed main runs.
    environment: publish-bicep
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout trusted controller and downloader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout frozen schema seeds as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.source_commit }}
          path: candidate
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/aws-type-downloader/go.mod
          cache: false

      - name: Build controller downloader and retain pinned schema inputs
        run: |
          (cd src/aws-type-downloader && go build -o "${RUNNER_TEMP}/aws-type-downloader" .)
          mkdir -p "${INPUT_DIRECTORY}/schemas/radius/pkg/aws/extraproperties"
          cp candidate/artifacts/types/*.json "${INPUT_DIRECTORY}/schemas/"
          cp candidate/radius/pkg/aws/extraproperties/extra_properties.json "${INPUT_DIRECTORY}/schemas/radius/pkg/aws/extraproperties/"
          if [[ -d candidate/radius/pkg/aws/schemas ]]; then
            cp -R candidate/radius/pkg/aws/schemas "${INPUT_DIRECTORY}/schemas/radius/pkg/aws/"
          fi
          git -C candidate/radius rev-parse HEAD > "${INPUT_DIRECTORY}/schemas/radius-commit"

      - name: Refresh schemas using only the trusted controller downloader
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_CONFIG_FILE: /dev/null
        run: |
          test -n "${AWS_ACCESS_KEY_ID}" && test -n "${AWS_SECRET_ACCESS_KEY}" || {
            echo "::error::Configure the reviewed main-only schema identity environment"; exit 1;
          }
          "${RUNNER_TEMP}/aws-type-downloader" --output "${INPUT_DIRECTORY}/schemas" --clean

      - name: Bind raw inputs to frozen source and controller
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: capture-schemas

      - name: Retain immutable raw schema inputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.INPUT_DIRECTORY }}/aws-schema-inputs-${{ github.run_id }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 90

  capture:
    name: Capture versioned AWS Bicep types
    needs: [select, schemas]
    if: >-
      always() && needs.select.result == 'success' &&
      (needs.schemas.result == 'success' || needs.select.outputs.reuse == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ needs.select.outputs.artifact_id || steps.upload.outputs.artifact-id }}
      generation_run_id: ${{ needs.select.outputs.generation_run_id }}
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: [5000/tcp]
    steps:
      - name: Checkout default-main capture helper
        if: needs.select.outputs.reuse == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install trusted native tools
        if: needs.select.outputs.reuse == 'false'
        run: |
          bash .github/scripts/install-bicep-tools.sh "${RUNNER_TEMP}/bicep-tools"
          echo "${RUNNER_TEMP}/bicep-tools" >> "${GITHUB_PATH}"

      - name: Download original schema data
        if: needs.select.outputs.reuse == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.schemas.outputs.artifact_id }}
          path: ${{ env.INPUT_DIRECTORY }}/input-download
          github-token: ${{ github.token }}
          repository: radius-project/bicep-types-aws
          run-id: ${{ github.run_id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Authenticate schema input job and raw bytes
        if: needs.select.outputs.reuse == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: prepare-schemas
          INPUT_ARTIFACT_ID: ${{ needs.schemas.outputs.artifact_id }}

      - name: Checkout frozen generator without privileged credentials
        if: needs.select.outputs.reuse == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.source_commit }}
          path: candidate
          persist-credentials: false
          submodules: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.select.outputs.reuse == 'false'
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Generate from frozen code and captured inputs
        if: needs.select.outputs.reuse == 'false'
        env:
          TYPE_VERSION: ${{ needs.select.outputs.type_version }}
        run: |
          npm --prefix candidate/bicep-types/src/bicep-types ci
          npm --prefix candidate/bicep-types/src/bicep-types run build
          npm --prefix candidate/src/aws-type-generator ci
          npm --prefix candidate/src/aws-type-generator run build
          node candidate/src/aws-type-generator/dist/src/main.js \
            --input "${INPUT_DIRECTORY}/schemas" --output "${INPUT_DIRECTORY}/generated" \
            --radius "${INPUT_DIRECTORY}/schemas/radius" --releaseVersion "${TYPE_VERSION}"

      - name: Capture native data-only OCI graph
        if: needs.select.outputs.reuse == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: capture
          INPUT_REGISTRY: localhost:${{ job.services.registry.ports['5000'] }}

      - name: Retain original raw snapshot
        if: needs.select.outputs.reuse == 'false'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.INPUT_DIRECTORY }}/bicep-types-aws-${{ github.run_id }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish full AWS Bicep version
    needs: [capture]
    if: ${{ !cancelled() && needs.capture.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publish-bicep
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout default-main publisher, never candidate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install trusted OCI copy tool
        run: |
          bash .github/scripts/install-bicep-tools.sh "${RUNNER_TEMP}/bicep-tools" oras
          echo "${RUNNER_TEMP}/bicep-tools" >> "${GITHUB_PATH}"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/bicep-write-credentials" >> "${GITHUB_ENV}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: ${{ env.INPUT_DIRECTORY }}/download
          github-token: ${{ github.token }}
          repository: radius-project/bicep-types-aws
          run-id: ${{ needs.capture.outputs.generation_run_id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Authenticate original capture and controller, validate data-only artifact
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: prepare
          INPUT_ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish or verify identical full version
        id: publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-bicep.mjs`);
            await script({github, core, context});
        env:
          INPUT_OPERATION: publish

      - name: Retain the single R3 record
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-bicep-extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.INPUT_DIRECTORY }}/record/aws-bicep-extension.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain partial or completed publication receipt separately
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-bicep-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.INPUT_DIRECTORY }}/receipt.json
          if-no-files-found: error
          retention-days: 90
