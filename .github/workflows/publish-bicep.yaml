# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Dispatch tagged Bicep Types publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions: {}

jobs:
  dispatch-publish:
    name: Dispatch tagged Bicep Types publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.repository == 'radius-project/bicep-types-aws' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read # Required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Get GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: github-app-token
        with:
          app-id: ${{ secrets.RADIUS_PUBLISHER_BOT_APP_ID }}
          private-key: ${{ secrets.RADIUS_PUBLISHER_BOT_PRIVATE_KEY }}
          permission-metadata: read
          permission-actions: read
          permission-contents: write
          owner: azure-octo
          repositories: |
            radius-publisher

      - name: Dispatch or resume correlated tagged publication
        id: monitor-remote-workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.github-app-token.outputs.token }}
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/monitor-remote-workflow.mjs`)
            await script({context, github, core})
        env:
          INPUT_OWNER: azure-octo
          INPUT_REPO: radius-publisher
          INPUT_WORKFLOW_FILE: publish-bicep-types-aws.yml
          INPUT_EVENT_TYPE: bicep-types-aws
          INPUT_RELEASE_IDENTIFIER: ${{ format('{0}-{1}', env.REL_VERSION, github.sha) }}
          INPUT_CLIENT_PAYLOAD: |-
            {
              "source_repository": ${{ toJSON(github.repository) }},
              "source_ref": ${{ toJSON(github.ref) }},
              "source_sha": ${{ toJSON(github.sha) }},
              "rel_channel": ${{ toJSON(env.REL_CHANNEL) }},
              "registry_target": "aws",
              "release_identifier": ${{ toJSON(format('{0}-{1}', env.REL_VERSION, github.sha)) }}
            }
          INPUT_MAX_WAIT_SECONDS: "2400"
          INPUT_POLL_INTERVAL_SECONDS: "15"

      - name: Show failed logs
        if: failure() && steps.monitor-remote-workflow.outputs.run_id != ''
        run: |
          gh run view "${RUN_ID}" --repo azure-octo/radius-publisher --log-failed || true
        env:
          RUN_ID: ${{ steps.monitor-remote-workflow.outputs.run_id }}
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
