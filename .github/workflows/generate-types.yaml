# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Generate Bicep types for AWS

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: 0 6 * * 1
  workflow_dispatch:
    inputs: {}

permissions: {}

# Runs share one pull request branch, so do not let two runs push to it at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate-types:
    name: Generate Bicep types for AWS
    runs-on: ubuntu-24.04
    # The pull request targets the branch the run starts from and every run
    # shares one head branch, so only runs from main may update it.
    if: github.repository == 'radius-project/bicep-types-aws' && github.ref == 'refs/heads/main' && github.ref_protected
    # A full download describes every AWS resource type, which can take well
    # over 10 minutes when AWS throttles the requests.
    timeout-minutes: 60
    permissions:
      contents: read # Required for actions/checkout and actions/create-github-app-token
      issues: write # Required to open or update the issue for clashes with Radius types
    env:
      GOPROXY: https://proxy.golang.org
      AWS_REGION: us-west-2
      # Every run reuses this branch, so an open pull request is updated
      # instead of a new one being opened.
      PR_BRANCH: generate-aws-types
      # GitHub rejects pull request bodies over 65,536 characters. The two
      # reports share 60,000, which leaves room for the rest of the body.
      PR_BREAKING_REPORT_MAX_LENGTH: 40000
      PR_ADDED_REPORT_MAX_LENGTH: 20000
      # GitHub rejects job summaries over 1 MiB. The two reports share it.
      SUMMARY_BREAKING_REPORT_MAX_LENGTH: 700000
      SUMMARY_ADDED_REPORT_MAX_LENGTH: 300000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify current protected main before using credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            if (!branch.protected || branch.commit.sha !== context.sha) {
              throw new Error('Generation credentials require current protected main');
            }

      - name: Get date string
        id: get_date_string
        run: |
          echo "date_string=$(date +'%Y-%m-%d')" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ env.AWS_REGION }}
          aws configure set output json

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/aws-type-downloader/go.mod
          cache-dependency-path: src/aws-type-downloader/go.sum

      - name: Install node and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      # Also checks out the radius submodule at its pinned commit, for the schemas Radius owns.
      - name: Init submodules
        run: |
          git submodule update --init --recursive

      - name: Build bicep-types
        run: |
          pushd ./bicep-types/src/bicep-types
          npm ci
          npm run build
          popd

      - name: Save the current AWS types
        run: |
          cp -R ./artifacts/types "${RUNNER_TEMP}/previous-types"

      # The clash report compares against the Radius commit the checked-in types were
      # generated from, recorded in artifacts/radius-commit. Dependabot moves the radius
      # submodule without regenerating the types, so the submodule commit on main can't
      # tell which Radius schemas are new.
      - name: Save the previous Radius inputs
        run: |
          mkdir -p "${RUNNER_TEMP}/previous-radius"
          previous="$(cat artifacts/radius-commit 2>/dev/null || true)"
          if [[ ! "${previous}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::artifacts/radius-commit has no commit, so every clash with a Radius schema is reported."
            exit 0
          fi
          if ! git -C radius fetch -q --depth 1 origin "${previous}"; then
            echo "::warning::Could not fetch the previous Radius commit ${previous}, so every clash with a Radius schema is reported."
            exit 0
          fi
          git -C radius archive "${previous}" | tar -x -C "${RUNNER_TEMP}/previous-radius"

      - name: Download AWS types
        run: |
          pushd ./src/aws-type-downloader
          go run main.go --output ../../artifacts/types --clean
          popd

      - name: Generate AWS Bicep types
        run: |
          pushd ./src/aws-type-generator
          npm ci
          npm run start -- --input ../../artifacts/types --output ../../artifacts/bicep --clash-report "${RUNNER_TEMP}/radius-clashes.md" \
            --previous-input "${RUNNER_TEMP}/previous-types" --previous-radius "${RUNNER_TEMP}/previous-radius"
          popd
          git -C radius rev-parse HEAD > artifacts/radius-commit

      # AWS published a type or property with the same name as one Radius provides.
      # The generator kept Radius's type and AWS's property, so this reports the
      # clash for a person to review instead of failing. The report has only clashes
      # where either side is new, so a reviewed clash is not reported again.
      # A clash stays new until the refresh pull request merges, so a run that finds
      # the same clashes in any issue, open or closed, does nothing. Otherwise it
      # comments on the open issue, or opens one.
      - name: Open or update the issue for clashes with Radius types
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/radius-clashes.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: AWS types clash with Radius types
        run: |
          if [[ ! -f "${REPORT}" ]]; then
            echo "No AWS types or properties clash with Radius's."
            exit 0
          fi

          {
            echo "The type refresh found AWS types or properties with the same name as ones Radius provides. The generated types already keep Radius's schema for each clashing type and AWS's property for each clashing property, and merging the refresh publishes them. Please review each clash below."
            echo
            echo "Radius commit: radius-project/radius@$(git -C radius rev-parse HEAD)"
            echo
            cat "${REPORT}"
            echo
            echo "Found by [this workflow run](${RUN_URL}). Close this issue after the pull request that refreshes the types merges."
          } > "${RUNNER_TEMP}/radius-clashes-issue.md"

          # Open issues first, then newest first.
          issues="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --label aws-types --limit 500 --json number,title,state \
            --jq 'map(select(.title == env.TITLE)) | sort_by([.state != "OPEN", -.number]) | .[] | "\(.number) \(.state)"')"

          # Compare only the report, since the Radius commit and run link change every run.
          open_number=""
          while read -r number state; do
            [[ -n "${number}" ]] || continue
            if [[ "${state}" == "OPEN" && -z "${open_number}" ]]; then
              open_number="${number}"
            fi
            reported="$(REPORT_TEXT="$(cat "${REPORT}")" gh issue view "${number}" --repo "${GITHUB_REPOSITORY}" --json body,comments \
              --jq '[.body] + [.comments[].body] | any(contains(env.REPORT_TEXT))')"
            if [[ "${reported}" == "true" ]]; then
              echo "Issue #${number} already lists these clashes."
              exit 0
            fi
          done <<< "${issues}"

          if [[ -n "${open_number}" ]]; then
            gh issue comment "${open_number}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/radius-clashes-issue.md"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --label aws-types --body-file "${RUNNER_TEMP}/radius-clashes-issue.md"
          fi

      - name: Generate reference documentation
        run: |
          python ./.github/scripts/generate-reference-docs.py ./artifacts/types ./docs/reference/supported-resources.md

      - name: Check for breaking changes and new types
        working-directory: src/aws-type-downloader
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATE_STRING: ${{ steps.get_date_string.outputs.date_string }}
        run: |
          {
            echo "## Changes that can break existing templates"
            echo
            go run . breaking-changes --old "${RUNNER_TEMP}/previous-types" --new ../../artifacts/types --max-length "${SUMMARY_BREAKING_REPORT_MAX_LENGTH}"
            echo
            echo "## New read-only and create-and-delete-only types"
            echo
            go run . added-types --old "${RUNNER_TEMP}/previous-types" --new ../../artifacts/types --max-length "${SUMMARY_ADDED_REPORT_MAX_LENGTH}"
          } >> "${GITHUB_STEP_SUMMARY}"

          radius_commit="$(git -C ../../radius rev-parse HEAD)"
          report="$(go run . breaking-changes --old "${RUNNER_TEMP}/previous-types" --new ../../artifacts/types --max-length "${PR_BREAKING_REPORT_MAX_LENGTH}")"
          added="$(go run . added-types --old "${RUNNER_TEMP}/previous-types" --new ../../artifacts/types --max-length "${PR_ADDED_REPORT_MAX_LENGTH}")"

          cat > "${RUNNER_TEMP}/pr-body.md" <<EOF
          ## Autogenerated report

          - Downloaded AWS types from the AWS CloudFormation registry on ${DATE_STRING}.
          - Generated Bicep types from the AWS types, with the schemas and extra properties Radius owns from radius-project/radius@${radius_commit}.
          - Updated the reference documentation.

          Merging this pull request publishes the updated AWS extension.

          ## Changes that can break existing templates

          These are removed resource types, types that became read-only, types that can no longer be updated, removed properties, properties that became required, and properties whose type changed.

          ${report}

          ## New read-only and create-and-delete-only types

          Templates can only reference a read-only type with \`existing\`, and can't update a create-and-delete-only type. Check that each type belongs in the extension, for example that it isn't a legacy or deprecated type that Radius rejects.

          ${added}

          Generated by [this workflow run](${RUN_URL}).
          EOF

      # Generate a short-lived installation token scoped to this repository.
      # Requires the RADIUS_TYPES_BOT GitHub App installed on
      # radius-project/bicep-types-aws with the minimal permissions:
      #   Contents: Read & Write, Pull requests: Read & Write
      - name: Get App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_TYPES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_TYPES_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          repositories: bicep-types-aws

      # Resolve the bot's GitHub-formatted name and email dynamically from the
      # app slug so commits are attributed to the bot identity rather than
      # hardcoded values.
      - name: Get bot details
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.app-token.outputs.app-slug }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # main requires verified signatures. The action then creates the
          # commit through the GitHub API, so GitHub signs it as the app's bot
          # and ignores the committer and author below.
          sign-commits: true
          committer: ${{ steps.bot-details.outputs.name-email }}
          author: ${{ steps.bot-details.outputs.name-email }}
          signoff: true
          branch: ${{ env.PR_BRANCH }}
          delete-branch: true
          title: |
            Generate bicep types for AWS: ${{ steps.get_date_string.outputs.date_string }}
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: |
            Update Bicep types for AWS: ${{ steps.get_date_string.outputs.date_string }}
          labels: |
            autogenerated
            github_actions
            aws-types
          draft: false
