# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Generate Bicep types for AWS

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: 0 6 * * 1
  workflow_dispatch:
    inputs: {}

permissions: {}

# Runs share one pull request branch, so do not let two runs push to it at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate-types:
    name: Generate Bicep types for AWS
    runs-on: ubuntu-24.04
    # The pull request targets the branch the run starts from and every run
    # shares one head branch, so only runs from main may update it.
    if: github.repository == 'radius-project/bicep-types-aws' && github.ref == 'refs/heads/main'
    # A full download describes every AWS resource type, which can take well
    # over 10 minutes when AWS throttles the requests.
    timeout-minutes: 60
    permissions:
      contents: read # Required for actions/checkout and actions/create-github-app-token
    env:
      GOPROXY: https://proxy.golang.org
      AWS_REGION: us-west-2
      # Every run reuses this branch, so an open pull request is updated
      # instead of a new one being opened.
      PR_BRANCH: generate-aws-types
      # GitHub rejects pull request bodies over 65,536 characters. This leaves
      # room for the rest of the body.
      PR_REPORT_MAX_LENGTH: 60000
      # GitHub rejects job summaries over 1 MiB.
      SUMMARY_REPORT_MAX_LENGTH: 1000000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get date string
        id: get_date_string
        run: |
          echo "date_string=$(date +'%Y-%m-%d')" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ env.AWS_REGION }}
          aws configure set output json

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/aws-type-downloader/go.mod
          cache-dependency-path: src/aws-type-downloader/go.sum

      - name: Install node and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Init bicep-types submodule
        run: |
          git submodule update --init --recursive

      - name: Build bicep-types
        run: |
          pushd ./bicep-types/src/bicep-types
          npm ci
          npm run build
          popd

      - name: Save the current AWS types
        run: |
          cp -R ./artifacts/types "${RUNNER_TEMP}/previous-types"

      - name: Download AWS types
        run: |
          pushd ./src/aws-type-downloader
          go run main.go --output ../../artifacts/types --clean
          popd

      - name: Generate AWS Bicep types
        run: |
          pushd ./src/aws-type-generator
          npm ci
          npm run start -- --input ../../artifacts/types --output ../../artifacts/bicep
          popd

      - name: Generate reference documentation
        run: |
          python ./.github/scripts/generate-reference-docs.py ./artifacts/types ./docs/reference/supported-resources.md

      - name: Check for breaking changes
        working-directory: src/aws-type-downloader
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATE_STRING: ${{ steps.get_date_string.outputs.date_string }}
        run: |
          {
            echo "## Changes that can break existing templates"
            echo
            go run . breaking-changes --old "${RUNNER_TEMP}/previous-types" --new ../../artifacts/types --max-length "${SUMMARY_REPORT_MAX_LENGTH}"
          } >> "${GITHUB_STEP_SUMMARY}"

          report="$(go run . breaking-changes --old "${RUNNER_TEMP}/previous-types" --new ../../artifacts/types --max-length "${PR_REPORT_MAX_LENGTH}")"

          cat > "${RUNNER_TEMP}/pr-body.md" <<EOF
          ## Autogenerated report

          - Downloaded AWS types from the AWS CloudFormation registry on ${DATE_STRING}.
          - Generated Bicep types from the AWS types.
          - Updated the reference documentation.

          Merging this pull request publishes the updated AWS extension.

          ## Changes that can break existing templates

          These are removed resource types, removed properties, properties that became required, and properties whose type changed.

          ${report}

          Generated by [this workflow run](${RUN_URL}).
          EOF

      # Generate a short-lived installation token scoped to this repository.
      # Requires the RADIUS_TYPES_BOT GitHub App installed on
      # radius-project/bicep-types-aws with the minimal permissions:
      #   Contents: Read & Write, Pull requests: Read & Write
      - name: Get App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RADIUS_TYPES_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_TYPES_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          repositories: bicep-types-aws

      # Resolve the bot's GitHub-formatted name and email dynamically from the
      # app slug so commits are attributed to the bot identity rather than
      # hardcoded values.
      - name: Get bot details
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.app-token.outputs.app-slug }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # main requires verified signatures. The action then creates the
          # commit through the GitHub API, so GitHub signs it as the app's bot
          # and ignores the committer and author below.
          sign-commits: true
          committer: ${{ steps.bot-details.outputs.name-email }}
          author: ${{ steps.bot-details.outputs.name-email }}
          signoff: true
          branch: ${{ env.PR_BRANCH }}
          delete-branch: true
          title: |
            Generate bicep types for AWS: ${{ steps.get_date_string.outputs.date_string }}
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: |
            Update Bicep types for AWS: ${{ steps.get_date_string.outputs.date_string }}
          labels: |
            autogenerated
            github_actions
            aws-types
          draft: false
