# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publishing-fixtures:
    name: Test Bicep publishing without cloud credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install pinned fixture tools
        run: |
          bash .github/scripts/install-bicep-tools.sh "${RUNNER_TEMP}/bicep-tools"
          echo "${RUNNER_TEMP}/bicep-tools" >> "${GITHUB_PATH}"

      - name: Exercise helper and native OCI fixtures
        run: bash .github/scripts/test-publish-bicep.sh

  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/aws-type-downloader/go.mod
          cache-dependency-path: src/aws-type-downloader/go.sum

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Build aws-type-downloader
        env:
          GOPROXY: https://proxy.golang.org
        working-directory: src/aws-type-downloader
        run: go build .

      - name: Test aws-type-downloader
        env:
          GOPROXY: https://proxy.golang.org
        working-directory: src/aws-type-downloader
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: src/aws-type-downloader

      - run: git submodule update --init --recursive

      - run: npm ci
        working-directory: bicep-types/src/bicep-types

      - run: npm run build
        working-directory: bicep-types/src/bicep-types

      - run: npm ci
        working-directory: src/aws-type-generator

      - run: npm run build
        working-directory: src/aws-type-generator

      - run: npm test
        working-directory: src/aws-type-generator

      # Same Bicep version and checksum that Radius pins in build/tools.yaml.
      - name: Install Bicep
        env:
          BICEP_VERSION: v0.46.1
          BICEP_SHA256: 3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9
        run: |
          mkdir -p "${RUNNER_TEMP}/bicep"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/bicep/bicep" "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  ${RUNNER_TEMP}/bicep/bicep" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/bicep/bicep"
          echo "${RUNNER_TEMP}/bicep" >> "${GITHUB_PATH}"

      - name: Build templates with the generated types
        working-directory: src/aws-type-generator
        run: npm run test:bicep

      - name: Verify actual generator CLI version compatibility without AWS
        env:
          AWS_BICEP_TEST_GENERATOR: "true"
        run: node --test --test-name-pattern='generator CLI' .github/scripts/publish-bicep.test.mjs
